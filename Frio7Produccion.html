<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Frío 7 · Producción</title>
<meta name="theme-color" content="#0f172a" />
<meta name="apple-mobile-web-app-title" content="Frío 7 Producción" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<!--
  FRÍO 7 · SISTEMA OPERATIVO DE PRODUCCIÓN  (MVP piloto "Espacio Joven")
  ---------------------------------------------------------------------
  Diseño: sistema aplicado de UI-UX-Pro-Max (uupm.cc).
    · Estilo: "Data-Dense Dashboard" + "Swiss Modernism 2.0"
    · Tipografía: pairing "Financial Trust" → IBM Plex Sans + IBM Plex Mono
    · Paleta: escala slate neutra + un único acento; estado solo verde/ámbar/rojo
    · Iconografía SVG de línea (sin emojis), contraste >= 4.5:1,
      hover sin desplazar layout, cursor-pointer, estado por icono+texto.

  App de un solo archivo. Sin dependencias ni build.
  Persistencia: localStorage. Esquema calcado del modelo Supabase del PRD.
  Interacción del lookahead reutiliza el arrastre ratón+dedo del "planifiqueitor".
-->
<style>
  :root{
    /* Neutros (escala slate) */
    --bg:#f1f5f9;
    --surface:#ffffff;
    --surface-2:#f8fafc;
    --surface-3:#f1f5f9;
    --text:#0f172a;        /* slate-900 */
    --text-2:#475569;      /* slate-600  (~7:1 sobre blanco) */
    --muted:#64748b;       /* slate-500  (~4.6:1) */
    --line:#e2e8f0;        /* slate-200 */
    --line-2:#cbd5e1;      /* slate-300 */
    --ink:#0f172a;         /* barra superior */

    /* Acento único */
    --accent:#2563eb;      /* blue-600 */
    --accent-700:#1d4ed8;
    --accent-weak:#eff6ff; /* blue-50 */
    --accent-line:#bfdbfe; /* blue-200 */

    /* Estado (solo semáforo) */
    --ok:#15803d;   --ok-bg:#f0fdf4;  --ok-line:#bbf7d0;
    --warn:#b45309; --warn-bg:#fffbeb; --warn-line:#fde68a;
    --bad:#b91c1c;  --bad-bg:#fef2f2;  --bad-line:#fecaca;
    --neu:#475569;  --neu-bg:#f1f5f9;  --neu-line:#e2e8f0;

    --r:8px; --r-sm:6px; --r-lg:10px;
    --sh:0 1px 2px rgba(15,23,42,.04);
    --sh-pop:0 10px 30px rgba(15,23,42,.14);
    --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    color:var(--text);background:var(--bg);min-height:100vh;
    font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;
  }
  .num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
  svg.ic{flex:0 0 auto;vertical-align:middle;}
  ::selection{background:var(--accent-weak);}

  /* ============ BARRA SUPERIOR ============ */
  .top{
    position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
    padding:11px 18px;background:var(--ink);color:#fff;
    border-bottom:1px solid #1e293b;padding-top:max(11px,env(safe-area-inset-top));
  }
  .marca{display:flex;align-items:center;gap:11px;min-width:0;}
  .logo{
    width:38px;height:38px;border-radius:9px;flex:0 0 auto;background:var(--accent);
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:-.5px;
  }
  .marca .n{font-weight:700;font-size:16px;line-height:1.1;letter-spacing:-.2px;white-space:nowrap;}
  .marca .s{font-size:11.5px;color:#94a3b8;font-weight:500;margin-top:1px;}
  .top .sep{flex:1;}
  select.rol,.obra-sel{
    font-family:inherit;font-weight:600;font-size:13.5px;color:var(--text);
    background:#fff;border:1px solid var(--line-2);border-radius:var(--r);
    padding:8px 11px;cursor:pointer;max-width:52vw;
  }
  select.rol:focus,.obra-sel:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);}
  .ico-btn{
    width:36px;height:36px;border-radius:var(--r);border:1px solid #1e293b;cursor:pointer;
    background:#1e293b;color:#cbd5e1;display:flex;align-items:center;justify-content:center;
    transition:background .12s,color .12s;
  }
  .ico-btn:hover{background:#334155;color:#fff;}

  /* ============ NAV ============ */
  .nav{
    display:flex;gap:2px;overflow-x:auto;background:var(--surface);
    border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:61px;z-index:40;scrollbar-width:none;
  }
  .nav::-webkit-scrollbar{display:none;}
  .nav button{
    border:none;background:none;cursor:pointer;white-space:nowrap;padding:13px 14px;
    font-size:13.5px;font-weight:600;color:var(--muted);
    border-bottom:2px solid transparent;transition:color .12s;
    display:flex;align-items:center;gap:7px;margin-bottom:-1px;
  }
  .nav button:hover{color:var(--text);}
  .nav button.on{color:var(--accent);border-bottom-color:var(--accent);}

  /* ============ LAYOUT ============ */
  .wrap{max-width:1440px;margin:0 auto;padding:22px 18px 60px;}
  .vista{display:none;}
  .vista.on{display:block;}

  .pagehead{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin:0 0 20px;}
  .pagehead h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.4px;}
  .pagehead .desc{color:var(--muted);font-size:13px;margin-top:3px;}
  .pagehead .sep{flex:1;}

  /* ============ KPIs ============ */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px;margin-bottom:22px;}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh);}
  .kpi .lab{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px;}
  .kpi .lab .ic{color:var(--muted);}
  .kpi .val{font-family:var(--mono);font-weight:600;font-size:26px;line-height:1.1;margin-top:10px;letter-spacing:-1px;}
  .kpi .val small{font-size:14px;color:var(--muted);}
  .kpi .sub{font-size:12px;margin-top:6px;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--text-2);}
  .kpi .sub.g{color:var(--ok);} .kpi .sub.w{color:var(--warn);} .kpi .sub.c{color:var(--bad);}
  .kpi .sub .pin{width:7px;height:7px;border-radius:2px;flex:0 0 auto;}
  .sub.g .pin{background:var(--ok);} .sub.w .pin{background:var(--warn);} .sub.c .pin{background:var(--bad);} .sub.n .pin{background:var(--accent);}

  /* ============ PANELES ============ */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:18px;overflow:hidden;}
  .panel>.cab{display:flex;align-items:center;gap:9px;padding:13px 16px;border-bottom:1px solid var(--line);}
  .panel>.cab h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;letter-spacing:-.1px;}
  .panel>.cab h3 .ic{color:var(--muted);}
  .panel>.cab .sep{flex:1;}
  .panel>.cuerpo{padding:16px;}
  .panel>.cuerpo.flush{padding:0;}

  /* ============ TABLAS ============ */
  .tabla-wrap{overflow-x:auto;}
  table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
  table.data th,table.data td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.data th{
    font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;
    cursor:pointer;user-select:none;position:sticky;top:0;background:var(--surface-2);
  }
  table.data th .arr{opacity:.35;font-size:9px;margin-left:2px;}
  table.data th.sort{color:var(--accent);} table.data th.sort .arr{opacity:1;}
  table.data tbody tr{cursor:pointer;transition:background .1s;}
  table.data tbody tr:hover{background:var(--surface-2);}
  table.data tbody tr:last-child td{border-bottom:none;}
  td.obra-cell{font-weight:600;color:var(--text);}
  td.obra-cell .mini{font-weight:500;}
  td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}

  /* ============ CHIPS ============ */
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;line-height:1.3;border:1px solid transparent;font-variant-numeric:tabular-nums;}
  .chip.g{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line);}
  .chip.w{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line);}
  .chip.c{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line);}
  .chip.n{background:var(--accent-weak);color:var(--accent-700);border-color:var(--accent-line);}
  .chip.x{background:var(--neu-bg);color:var(--neu);border-color:var(--neu-line);}
  .chip .ic{width:13px;height:13px;}
  .dot{width:8px;height:8px;border-radius:2px;display:inline-block;flex:0 0 auto;}
  .dot.g{background:var(--ok);} .dot.w{background:var(--warn);} .dot.c{background:var(--bad);} .dot.x{background:var(--muted);} .dot.n{background:var(--accent);}

  /* código de familia (reemplaza emoji) */
  .fcode{font-family:var(--mono);font-weight:600;font-size:10.5px;letter-spacing:.5px;color:var(--text-2);background:var(--surface-3);border:1px solid var(--line);border-radius:4px;padding:2px 5px;flex:0 0 auto;}

  /* barra de avance */
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:64px;flex:1;}
  .bar>i{display:block;height:100%;background:var(--accent);}
  .barwrap{display:flex;align-items:center;gap:9px;min-width:110px;}
  .barwrap b{font-family:var(--mono);font-size:12px;font-weight:600;min-width:34px;}

  /* ============ BOTONES ============ */
  .btn{border:1px solid transparent;cursor:pointer;border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:13.5px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:background .12s,border-color .12s;}
  .btn:active{transform:translateY(1px);}
  .btn .ic{width:16px;height:16px;}
  .btn-pri{background:var(--accent);color:#fff;}
  .btn-pri:hover{background:var(--accent-700);}
  .btn-ghost{background:var(--surface);color:var(--text);border-color:var(--line-2);}
  .btn-ghost:hover{border-color:var(--muted);background:var(--surface-2);}
  .btn-sm{padding:7px 11px;font-size:12.5px;}
  .btn-blk{width:100%;}

  /* ============ PESTAÑAS OBRA ============ */
  .subtabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 18px;scrollbar-width:none;}
  .subtabs::-webkit-scrollbar{display:none;}
  .subtabs button{border:none;background:none;cursor:pointer;white-space:nowrap;padding:10px 13px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .subtabs button:hover{color:var(--text);}
  .subtabs button.on{color:var(--accent);border-bottom-color:var(--accent);}

  /* familias / fases */
  .fam-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .fam-row:last-child{border-bottom:none;}
  .fam-row .nom{font-weight:500;min-width:170px;display:flex;align-items:center;gap:9px;font-size:13px;}
  .fam-row .track{flex:1;min-width:120px;}
  .fam-row .cifra{font-family:var(--mono);font-weight:600;min-width:110px;text-align:right;font-size:12.5px;}
  .track2{height:16px;border-radius:4px;background:var(--surface-3);overflow:hidden;}
  .track2>i{display:block;height:100%;background:var(--accent);}

  /* ============ LOOKAHEAD ============ */
  .lookahead{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;}
  .semana{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:180px;}
  .semana>.cab{padding:11px 13px;border-bottom:1px solid var(--line);}
  .semana>.cab .et{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .semana>.cab .rango{font-family:var(--mono);font-weight:600;font-size:13px;margin-top:3px;}
  .semana.compromiso{border-color:var(--accent-line);}
  .semana.compromiso>.cab{background:var(--accent-weak);border-bottom-color:var(--accent-line);}
  .semana.compromiso>.cab .et{color:var(--accent-700);}
  .semana .zona{padding:9px;display:flex;flex-direction:column;gap:9px;flex:1;transition:background .1s;}
  .semana .zona.drag-over{background:var(--accent-weak);outline:1px dashed var(--accent);outline-offset:-4px;border-radius:6px;}
  .semana .vacia{color:var(--muted);font-size:12px;text-align:center;padding:16px 6px;}

  .obj-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r-sm);padding:10px 11px;cursor:grab;user-select:none;transition:border-color .1s,background .1s;}
  .obj-card:hover{border-color:var(--line-2);background:var(--surface-2);}
  .obj-card:active{cursor:grabbing;}
  .obj-card.rdy{border-left-color:var(--ok);} .obj-card.wrn{border-left-color:var(--warn);} .obj-card.blk{border-left-color:var(--bad);}
  .obj-card .fam{display:flex;align-items:center;gap:7px;}
  .obj-card .ti{font-weight:600;font-size:13px;margin:7px 0;line-height:1.3;}
  .obj-card .meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);}
  .obj-card .meta .m{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-weight:500;}
  .obj-card .meta .ic{width:13px;height:13px;}

  /* ============ MÓVIL ENCARGADO ============ */
  .mob{max-width:560px;margin:0 auto;}
  .mob .sal{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;margin-bottom:14px;}
  .mob .sal .h{font-weight:700;font-size:18px;}
  .mob .sal .d{color:#94a3b8;font-size:12.5px;margin-top:3px;}
  .mcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;}
  .mcard .top2{padding:14px 15px 11px;border-left:4px solid var(--line-2);}
  .mcard.rdy .top2{border-left-color:var(--ok);} .mcard.wrn .top2{border-left-color:var(--warn);} .mcard.blk .top2{border-left-color:var(--bad);}
  .mcard .fam{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .mcard .ti{font-weight:700;font-size:16px;margin:7px 0 3px;line-height:1.3;}
  .mcard .ob{font-size:12.5px;color:var(--muted);}
  .mcard .horas{display:flex;gap:9px;padding:0 15px 13px;}
  .mcard .hbox{flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px;text-align:center;}
  .mcard .hbox .n{font-family:var(--mono);font-weight:600;font-size:19px;}
  .mcard .hbox .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-top:2px;}
  .mcard .hbox.rest .n{color:var(--accent);}
  .mcard .acc{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-top:1px solid var(--line);}
  .mcard .acc button{border:none;background:var(--surface);cursor:pointer;padding:14px 8px;font-weight:600;font-size:13px;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--text);transition:background .1s;min-height:44px;}
  .mcard .acc button:hover{background:var(--surface-2);}
  .mcard .acc button .ic{width:20px;height:20px;color:var(--muted);}
  .mcard .acc button.fin{color:var(--ok);} .mcard .acc button.fin .ic{color:var(--ok);}
  .mcard .acc button.blo{color:var(--bad);} .mcard .acc button.blo .ic{color:var(--bad);}
  .mavance{padding:0 15px 13px;}

  /* ============ MODAL ============ */
  .ov{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:100;display:none;align-items:flex-end;justify-content:center;}
  .ov.on{display:flex;}
  @media(min-width:640px){.ov{align-items:center;}}
  .modal{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:12px 12px 0 0;box-shadow:var(--sh-pop);padding-bottom:max(0px,env(safe-area-inset-bottom));}
  @media(min-width:640px){.modal{border-radius:12px;}}
  .modal .mh{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);}
  .modal .mh h3{margin:0;font-size:15.5px;font-weight:600;}
  .modal .mh .sep{flex:1;}
  .modal .mh .x{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;}
  .modal .mh .x:hover{background:var(--surface-2);}
  .modal .mb{padding:18px;}
  .modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface);}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:11.5px;font-weight:600;color:var(--text-2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:14.5px;color:var(--text);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;background:var(--surface);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);}
  .field textarea{resize:vertical;min-height:70px;}
  .field .row{display:flex;gap:10px;} .field .row>*{flex:1;}
  .seg{display:flex;gap:7px;flex-wrap:wrap;}
  .seg button{flex:1;min-width:80px;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:11px 8px;font-weight:600;font-size:13.5px;font-family:inherit;cursor:pointer;color:var(--text-2);transition:border-color .1s,background .1s;}
  .seg button:hover{border-color:var(--muted);}
  .seg button.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent-700);}
  .seg button.si.on{border-color:var(--ok-line);background:var(--ok-bg);color:var(--ok);}
  .seg button.no.on{border-color:var(--bad-line);background:var(--bad-bg);color:var(--bad);}

  .hint{font-size:12.5px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;line-height:1.5;display:flex;gap:9px;}
  .hint .ic{color:var(--muted);margin-top:1px;}
  .hint.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#92500a;} .hint.warn .ic{color:var(--warn);}
  .hint.bad{background:var(--bad-bg);border-color:var(--bad-line);color:#991b1b;} .hint.bad .ic{color:var(--bad);}

  .empty{text-align:center;padding:48px 20px;color:var(--muted);}
  .empty .ic{color:var(--line-2);}
  .empty p{margin:12px 0 0;font-size:13.5px;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);z-index:200;background:var(--ink);color:#fff;padding:12px 18px;border-radius:var(--r);font-weight:600;font-size:13.5px;box-shadow:var(--sh-pop);opacity:0;transition:transform .25s,opacity .25s;max-width:90vw;display:flex;align-items:center;gap:9px;}
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
  .toast .ic{width:17px;height:17px;}

  .ghost-drag{position:fixed;z-index:999;pointer-events:none;opacity:.95;box-shadow:var(--sh-pop);transform:translate(-50%,-50%);}
  .mini{font-size:11.5px;color:var(--muted);}
  .pill-info{display:inline-flex;gap:6px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 9px;font-size:12px;font-weight:600;font-family:var(--mono);}

  @media(max-width:760px){
    .lookahead{grid-template-columns:1fr;}
    .pagehead h2{font-size:19px;}
    .marca .s{display:none;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="marca">
    <div class="logo">F7</div>
    <div>
      <div class="n">Frío 7 · Producción</div>
      <div class="s">Sistema operativo de producción</div>
    </div>
  </div>

/* ===================================================================
   MOTOR DE KPIs
   =================================================================== */
function P(id){ return DB.proyectos.find(p=>p.id===id); }
function compsDe(obraId){ return DB.compromisos.filter(c=>c.obra===obraId); }

function kpiObra(p){
  const baseline=p.baseline_horas, actual=DB.consumo[p.id]||0, rem=DB.restante[p.id]||0;
  const eac=actual+rem, vac=baseline-eac, desvH=eac-baseline, desvPct=baseline?(desvH/baseline*100):0;
  const avance=baseline?Math.min(100,actual/eac*100):0;
  const comps=compsDe(p.id);
  const comprometidos=comps.filter(c=>["planificado","curso","terminado"].includes(c.estado));
  const terminados=comps.filter(c=>c.estado==="terminado");
  const ppc=comprometidos.length?(terminados.length/comprometidos.length*100):null;
  const cert=p.certificacion||{objetivo_mes:0,prevista:0};
  const certPct=cert.objetivo_mes?(cert.prevista/cert.objetivo_mes*100):null;
  const diasRest=diasEntre(ISO(hoy()),p.fecha_fin_contractual);
  const rwH=DB.retrabajos.filter(r=>r.obra===p.id).reduce((s,r)=>s+(+r.horas||0),0);
  const semDesv=semaforoDesv(desvPct), semPpc=ppc==null?"x":semaforoPpc(ppc);
  const riesgo=peor([semDesv,semPpc,diasRest<0?"c":"g",(certPct!=null&&certPct<90)?"w":"g"]);
  return {baseline,actual,rem,eac,vac,desvH,desvPct,avance,ppc,cert,certPct,diasRest,rwH,semDesv,semPpc,riesgo};
}
function semaforoDesv(pct){ const c=DB.config.desv,a=Math.abs(pct); if(a<=c.green)return"g"; if(a<=c.warn)return"w"; return"c"; }
function semaforoPpc(pct){ const c=DB.config.ppc; if(pct>=c.green)return"g"; if(pct>=c.warn)return"w"; return"c"; }
const ORD={g:0,x:1,w:2,c:3};
function peor(arr){ return arr.reduce((a,b)=>ORD[b]>ORD[a]?b:a,"g"); }
const SEM_RIESGO={g:"Bajo",w:"Medio",c:"Alto",x:"—"};

function kpiGlobal(){
  let baseline=0,actual=0,eac=0,vac=0,enRiesgo=0,rwH=0,ppcNum=0,ppcDen=0,certObj=0,certPrev=0;
  DB.proyectos.forEach(p=>{
    const k=kpiObra(p);
    baseline+=k.baseline;actual+=k.actual;eac+=k.eac;vac+=k.vac;rwH+=k.rwH;
    if(k.riesgo==="c"||k.riesgo==="w")enRiesgo++;
    const comps=compsDe(p.id);
    ppcDen+=comps.filter(c=>["planificado","curso","terminado"].includes(c.estado)).length;
    ppcNum+=comps.filter(c=>c.estado==="terminado").length;
    certObj+=k.cert.objetivo_mes||0;certPrev+=k.cert.prevista||0;
  });
  const ppc=ppcDen?ppcNum/ppcDen*100:null, desvPct=baseline?(eac-baseline)/baseline*100:0;
  return {obras:DB.proyectos.length,baseline,actual,eac,vac,desvPct,ppc,enRiesgo,rwH,certObj,certPrev};
}

function alertas(){
  const out=[];
  DB.proyectos.forEach(p=>{
    const k=kpiObra(p);
    if(k.vac<0) out.push({sev:"c",obra:p,txt:`EAC supera baseline en ${fmtH(-k.vac)}`});
    if(k.diasRest<0) out.push({sev:"c",obra:p,txt:`Fecha prevista supera la fecha contractual`});
    if(k.ppc!=null && semaforoPpc(k.ppc)==="c") out.push({sev:"c",obra:p,txt:`PPC bajo (${Math.round(k.ppc)} %)`});
    else if(k.ppc!=null && semaforoPpc(k.ppc)==="w") out.push({sev:"w",obra:p,txt:`PPC a vigilar (${Math.round(k.ppc)} %)`});
    if(k.certPct!=null && k.certPct<90) out.push({sev:"w",obra:p,txt:`Certificación prevista por debajo del objetivo (${Math.round(k.certPct)} %)`});
    if(k.rwH>=10) out.push({sev:"w",obra:p,txt:`Retrabajo elevado (${fmtH(k.rwH)})`});
    compsDe(p.id).forEach(c=>{
      if(estadoRestriccion(c)==="blocked" && c.semana<=2 && c.semana>=1) out.push({sev:"c",obra:p,txt:`Objetivo bloqueado próximo a inicio: ${c.titulo}`});
      if((c.materiales||[]).some(m=>!m.confirmado) && c.semana===1) out.push({sev:"w",obra:p,txt:`Material sin confirmar: ${c.titulo}`});
    });
  });
  const o={c:0,w:1,g:2,x:3};
  return out.sort((a,b)=>o[a.sev]-o[b.sev]);
}
function estadoRestriccion(c){
  const r=c.restricciones||[];
  if(r.some(x=>x.estado==="blocked"))return"blocked";
  if(r.some(x=>x.estado==="warning"))return"warning";
  return"ready";
}

function tablaObras(){

      <td><span class="chip ${k.diasRest<0?'c':k.diasRest<14?'w':'g'}">${k.diasRest<0?Math.abs(k.diasRest)+'d tarde':k.diasRest+'d'}</span></td>

function subResumen(p,k){
  const max=Math.max(...p.baselines.map(b=>b.horas),1);
  const filas=p.baselines.map(b=>{const f=famById(b.familia),pct=Math.round(b.horas/max*100);
    return `<div class="fam-row"><div class="nom">${fcode(f)}${esc(f.nom)}</div><div class="track"><div class="track2"><i style="width:${pct}%"></i></div></div><div class="cifra">${fmtH(b.horas)}</div></div>`;}).join("");
  return `
  <div class="panel"><div class="cab"><h3>${ICON("target",16)} Presupuesto productivo (baseline)</h3><div class="sep"></div><span class="pill-info">Total ${fmtH(p.baseline_horas)}</span></div>
    <div class="cuerpo"><div class="hint" style="margin-bottom:14px">${ICON("info",16)}<span>Las horas presupuestadas son la línea base económica. <b>No se modifican</b> una vez aprobada la obra; cualquier diferencia aparece como desviación.</span></div>${filas}</div></div>
  <div class="panel"><div class="cab"><h3>${ICON("gauge",16)} Previsión a terminación (EAC)</h3></div>

      <div class="fam-row"><div class="nom">Consumidas</div><div class="track"></div><div class="cifra">${fmtH(k.actual)}</div></div>

      <div class="fam-row"><div class="nom"><b>= EAC</b></div><div class="track"></div><div class="cifra" style="font-size:14px">${fmtH(k.eac)}</div></div>
      <div class="fam-row"><div class="nom"><b>VAC (baseline − EAC)</b></div><div class="track"></div><div class="cifra"><span class="chip ${k.semDesv}">${k.vac<0?"":"+"}${fmtH(k.vac)}</span></div></div>
    </div></div>`;
}
function editarRestante(id){
  const p=P(id),k=kpiObra(p);
  modal({titulo:"Ajustar estimación de horas restantes",cuerpo:`
    <div class="hint" style="margin-bottom:14px">${ICON("info",16)}<span>Actualiza la previsión de horas que faltan. Recalcula el EAC y la desviación prevista, sin tocar el baseline.</span></div>
    <div class="field"><label>Horas restantes estimadas</label><input type="number" id="f_rem" value="${k.rem}" min="0"></div>`,
    ok:"Guardar",onOk:()=>{DB.restante[id]=Math.max(0,+$("#f_rem").value||0);guardar();vistaObra();toast("Previsión actualizada");return true;}});
}
function subPlan(p){
  const inicio=p.plan.reduce((m,f)=>f.ini<m?f.ini:m,p.plan[0]?.ini||ISO(hoy()));
  const fin=p.plan.reduce((m,f)=>f.fin>m?f.fin:m,p.plan[0]?.fin||ISO(hoy()));
  const span=Math.max(1,diasEntre(inicio,fin));
  const barras=p.plan.map(f=>{const fa=famById(f.familia);
    const off=diasEntre(inicio,f.ini)/span*100, w=Math.max(3,diasEntre(f.ini,f.fin)/span*100);
    const col=f.estado==="fin"?"var(--ok)":f.estado==="curso"?"var(--accent)":"var(--line-2)";
    return `<div class="fam-row"><div class="nom">${fcode(fa)}${esc(fa.nom)}</div>
      <div class="track"><div class="track2"><i style="margin-left:${off}%;width:${w}%;background:${col};display:flex;align-items:center;justify-content:center;color:#fff;font-size:9px;font-weight:700;font-family:var(--mono)">${f.avance?f.avance+"%":""}</i></div></div>
      <div class="cifra" style="min-width:150px">${fDMA(f.ini)} → ${fDMA(f.fin)}</div></div>`;}).join("");
  return `<div class="panel"><div class="cab"><h3>${ICON("layers",16)} Plan maestro por fases</h3><div class="sep"></div><span class="mini">${fDMA(inicio)} — ${fDMA(fin)}</span></div>
    <div class="cuerpo">${barras||`<div class="empty">${ICON("layers",36)}<p>Sin fases.</p></div>`}</div></div>`;
}
function subLookahead(p){
  const t=hoy(),lunes=new Date(t);lunes.setDate(t.getDate()-((t.getDay()+6)%7));
  const rango=n=>{const a=new Date(lunes);a.setDate(lunes.getDate()+7*n);const b=new Date(a);b.setDate(a.getDate()+4);return `${fDMA(ISO(a))}–${fDMA(ISO(b))}`;};
  const et={1:"Compromiso firme",2:"Previsión",3:"Previsión",4:"Previsión"};
  const comps=compsDe(p.id);
  const cols=[1,2,3,4].map(s=>{
    const items=comps.filter(c=>c.semana===s).map(objCard).join("");
    return `<div class="semana ${s===1?'compromiso':''}"><div class="cab"><div class="et">${s===1?ICON("flag",13):""}Semana +${s} · ${et[s]}</div><div class="rango">${rango(s)}</div></div>
      <div class="zona" data-sem="${s}">${items||'<div class="vacia">Arrastra objetivos aquí</div>'}</div></div>`;
  }).join("");
  return `<div class="panel"><div class="cab"><h3>${ICON("calendar",16)} Lookahead 4 semanas</h3><div class="sep"></div><button class="btn btn-pri btn-sm" onclick="nuevoObjetivo('${p.id}')">${ICON("plus",15)} Objetivo</button></div>
    <div class="cuerpo"><div class="hint" style="margin-bottom:14px">${ICON("info",16)}<span>Arrastra (ratón o dedo) un objetivo entre semanas. <b>Semana +1 = compromiso firme.</b> Cada viernes la Semana +2 pasa a +1 y debe revisarse. Un objetivo <b style="color:var(--bad)">BLOCKED</b> no debería estar en el compromiso sin advertencia.</span></div>
      <div class="lookahead" id="board">${cols}</div></div></div>`;
}
function objCard(c){
  const f=famById(c.familia),er=estadoRestriccion(c);
  return `<div class="obj-card ${R2CLS[er]}" data-id="${c.id}" draggable="true" onclick="abrirObjetivo('${c.id}')">
    <div class="fam">${fcode(f)}<span class="mini">${esc(f.nom)}</span></div>
    <div class="ti">${esc(c.titulo)}</div>
    <div class="meta"><span class="chip ${R2CHIP[er]}">${R2TXT[er]}</span><span class="m">${ICON("target",13)}${c.horas_objetivo} h</span><span class="m">${ICON("user",13)}${esc(c.responsable)}</span></div>
  </div>`;
}
function activarLookahead(p){
  const board=$("#board"); if(!board) return;
  let arrastre=null;
  $$(".zona",board).forEach(z=>{
    z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("drag-over");});
    z.addEventListener("dragleave",()=>z.classList.remove("drag-over"));
    z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("drag-over");const id=arrastre?.id||e.dataTransfer.getData("text/plain");moverObjetivo(id,+z.dataset.sem);});
  });
  $$(".obj-card",board).forEach(card=>{
    const id=card.dataset.id;
    card.addEventListener("dragstart",e=>{arrastre={id};e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",id);}catch(_){}setTimeout(()=>card.style.opacity=".35",0);});
    card.addEventListener("dragend",()=>{card.style.opacity="1";arrastre=null;});
    card.style.touchAction="none";
    card.addEventListener("pointerdown",e=>{
      if(e.pointerType==="mouse")return;
      const sx=e.clientX,sy=e.clientY;let mov=false,ghost=null;
      const mv=ev=>{
        const dx=ev.clientX-sx,dy=ev.clientY-sy;
        if(!mov){if(Math.hypot(dx,dy)<9)return;mov=true;ghost=card.cloneNode(true);ghost.classList.add("ghost-drag");const r=card.getBoundingClientRect();ghost.style.width=r.width+"px";document.body.appendChild(ghost);card.style.opacity=".35";}
        ev.preventDefault();ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";
        const z=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".zona");$$(".zona.drag-over",board).forEach(n=>n.classList.remove("drag-over"));if(z)z.classList.add("drag-over");
      };
      const fin=ev=>{
        document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",fin);document.removeEventListener("pointercancel",fin);
        card.style.opacity="1";
        if(mov){if(ghost)ghost.remove();const z=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(".zona");$$(".zona.drag-over",board).forEach(n=>n.classList.remove("drag-over"));card._supClick=true;setTimeout(()=>card._supClick=false,350);if(z)moverObjetivo(id,+z.dataset.sem);}
      };
      document.addEventListener("pointermove",mv,{passive:false});document.addEventListener("pointerup",fin);document.addEventListener("pointercancel",fin);
    });
    card.addEventListener("click",e=>{if(card._supClick){e.stopImmediatePropagation();e.preventDefault();}},true);
  });
}
function moverObjetivo(id,sem){
  const c=DB.compromisos.find(x=>x.id===id); if(!c||c.semana===sem)return;
  c.semana=sem; c.estado=sem===1?(c.estado==="terminado"?"terminado":"planificado"):"previsto";
  if(sem===1&&estadoRestriccion(c)==="blocked") toast("Objetivo BLOQUEADO en el compromiso firme","alert");
  guardar(); vistaObra();
}
function subObjetivos(p){
  const comps=compsDe(p.id);
  if(!comps.length) return `<div class="panel"><div class="cuerpo"><div class="empty">${ICON("target",40)}<p>Sin objetivos. Crea el primero desde el lookahead.</p></div></div></div>`;
  const rows=comps.map(c=>{const f=famById(c.familia),er=estadoRestriccion(c);
    return `<tr onclick="abrirObjetivo('${c.id}')">
      <td class="obra-cell"><div style="display:flex;align-items:center;gap:8px">${fcode(f)}${esc(c.titulo)}</div><div class="mini">${esc(f.nom)}</div></td>
      <td>${esc(c.responsable)}</td>
      <td><span class="chip ${c.semana<1?'x':'n'}">${c.semana<1?'Hist.':'S+'+c.semana}</span></td>

  <div class="pagehead"><div><h2>Ajustes</h2><div class="desc">Umbrales de semáforo configurables · evita criterios arbitrarios</div></div></div>
  <div class="panel"><div class="cab"><h3>${ICON("trending",16)} Desviación de horas</h3></div><div class="cuerpo">
    <div class="field"><div class="row"><div><label>Verde hasta (%)</label><input type="number" id="dg" value="${c.desv.green}"></div><div><label>Ámbar hasta (%)</label><input type="number" id="dw" value="${c.desv.warn}"></div></div></div>
    <div class="mini">0–${c.desv.green}% verde · ${c.desv.green}–${c.desv.warn}% ámbar · &gt;${c.desv.warn}% crítico</div></div></div>
  <div class="panel"><div class="cab"><h3>${ICON("checkCircle",16)} PPC — Percent Plan Complete</h3></div><div class="cuerpo">
    <div class="field"><div class="row"><div><label>Verde desde (%)</label><input type="number" id="pg" value="${c.ppc.green}"></div><div><label>Ámbar desde (%)</label><input type="number" id="pw" value="${c.ppc.warn}"></div></div></div>
    <div class="mini">≥${c.ppc.green}% verde · ${c.ppc.warn}–${c.ppc.green}% ámbar · &lt;${c.ppc.warn}% crítico</div></div></div>
  <button class="btn btn-pri" onclick="guardarConfig()">Guardar ajustes</button>
  <div class="panel" style="margin-top:22px"><div class="cab"><h3>${ICON("info",16)} Acerca de</h3></div><div class="cuerpo"><div class="mini" style="line-height:1.7">
    MVP del Sistema Operativo de Producción de Frío 7 · piloto <b>Espacio Joven</b>.<br>
    Diseño según el sistema UI-UX-Pro-Max (estilo data-dense + Swiss, IBM Plex, iconografía SVG).<br>
    Datos en este navegador (localStorage); esquema calcado del modelo Supabase del PRD.<br>
    Fases 2–5 (preventivo, correctivo, incentivos, compras) no implementadas, arquitectura preparada.
  </div></div></div>`;
}
function guardarConfig(){ DB.config.desv.green=+$("#dg").value||5;DB.config.desv.warn=+$("#dw").value||10;DB.config.ppc.green=+$("#pg").value||85;DB.config.ppc.warn=+$("#pw").value||70;guardar();toast("Ajustes guardados"); }

/* ---- Modal ---- */
function modal({titulo,cuerpo,ok="Aceptar",onOk,after,soloOk,ancho}){
  const m=$("#modal"); m.style.maxWidth=ancho?"640px":"520px";
  m.innerHTML=`<div class="mh"><h3>${esc(titulo)}</h3><div class="sep"></div><button class="x" onclick="cerrarModal()" aria-label="Cerrar">${ICON("x",17)}</button></div>
    <div class="mb">${cuerpo}</div><div class="mf">${soloOk?"":`<button class="btn btn-ghost" onclick="cerrarModal()">Cancelar</button>`}<button class="btn btn-pri" id="mOk">${esc(ok)}</button></div>`;
  $("#ov").classList.add("on");
  $("#mOk").onclick=()=>{ if(!onOk){cerrarModal();return;} const r=onOk(); if(r!==false)cerrarModal(); };
  if(after)after();
}
function cerrarModal(){ $("#ov").classList.remove("on"); }
$("#ov").addEventListener("click",e=>{ if(e.target.id==="ov")cerrarModal(); });

/* ---- eventos / arranque ---- */
$("#rolSel").addEventListener("change",e=>{DB.rolActual=e.target.value;guardar();render();});
$("#btnReset").addEventListener("click",()=>{modal({titulo:"Reiniciar datos de demo",cuerpo:`<div class="hint bad">${ICON("alert",16)}<span>Esto borra todos los cambios y restaura el piloto Espacio Joven. ¿Continuar?</span></div>`,ok:"Sí, reiniciar",onOk:()=>{DB=semilla();guardar();render();toast("Datos restaurados");return true;}});});
$("#btnAjustes").addEventListener("click",()=>{ if(ROLES[DB.rolActual].vistas.includes("ajustes")) irA("ajustes"); });

if(!cargar()){ DB=semilla(); guardar(); }
render();
Object.assign(window,{irA,abrirObra,ordenar,abrirObjetivo,nuevoObjetivo,nuevaDesviacion,nuevaObra,editarRestante,editarCert,guardarConfig,mAvance,mBloqueo,mMaterial,mTerminar,cerrarModal});
</script>
</body>
</html>
